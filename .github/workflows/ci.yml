name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip install pip-audit && pip-audit -r requirements.txt
      - name: Train (offline data) and keep model artifact
        run: PYTHONPATH=src python -m house_price.model --offline --out artifacts
      - uses: actions/upload-artifact@v6
        with:
          name: model
          path: artifacts/
